name: Deploy Remote Access Service

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 📄 Create .env.production for Build
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          payload = os.environ.get("PRODUCTION_ENV_FILE", "")
          Path(".env.production").write_text(payload, encoding="utf-8")
          PY

      - name: 📄 Create frontend/.env.production for Frontend Build
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("frontend/.env.production")
          path.write_text(os.environ["FRONTEND_ENV"], encoding="utf-8")
          print(f"Created {path}")
          PY

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷 Set IMAGE_PREFIX
        run: |
          if [ -n "${{ secrets.IMAGE_PREFIX }}" ]; then
            RAW_IMAGE_PREFIX="${{ secrets.IMAGE_PREFIX }}"
          else
            RAW_IMAGE_PREFIX="${REGISTRY}/${IMAGE_NAME,,}"
          fi

          RAW_IMAGE_PREFIX="${RAW_IMAGE_PREFIX#https://}"
          RAW_IMAGE_PREFIX="${RAW_IMAGE_PREFIX#http://}"
          RAW_IMAGE_PREFIX="${RAW_IMAGE_PREFIX%/}"

          for svc in backend telegram_bot alembic frontend; do
            RAW_IMAGE_PREFIX="${RAW_IMAGE_PREFIX%/$svc}"
          done

          if [[ "${RAW_IMAGE_PREFIX##*/}" == *:* ]]; then
            echo "::error::IMAGE_PREFIX must not include a tag. Use: ghcr.io/<owner>/<repo>"
            exit 1
          fi

          echo "IMAGE_PREFIX=${RAW_IMAGE_PREFIX}" >> $GITHUB_ENV

      - name: 📦 Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Build and Push Bot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: telegram_bot/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/telegram_bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Build and Push Alembic
        uses: docker/build-push-action@v5
        with:
          context: .
          file: shared/alembic/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/alembic:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            docker-compose.prod.yml

      - name: 📄 Prepare Deploy Config Files
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          payload = os.environ.get("PRODUCTION_ENV_FILE", "")
          Path(".env.production").write_text(payload, encoding="utf-8")
          Path("frontend.env.production").write_text(os.environ["FRONTEND_ENV"], encoding="utf-8")
          PY

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 📡 Add server to known_hosts
        run: ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 🏷 Set IMAGE_PREFIX
        run: |
          if [ -n "${{ secrets.IMAGE_PREFIX }}" ]; then
            RAW_IMAGE_PREFIX="${{ secrets.IMAGE_PREFIX }}"
          else
            RAW_IMAGE_PREFIX="${REGISTRY}/${IMAGE_NAME,,}"
          fi

          RAW_IMAGE_PREFIX="${RAW_IMAGE_PREFIX#https://}"
          RAW_IMAGE_PREFIX="${RAW_IMAGE_PREFIX#http://}"
          RAW_IMAGE_PREFIX="${RAW_IMAGE_PREFIX%/}"

          for svc in backend telegram_bot alembic frontend; do
            RAW_IMAGE_PREFIX="${RAW_IMAGE_PREFIX%/$svc}"
          done

          if [[ "${RAW_IMAGE_PREFIX##*/}" == *:* ]]; then
            echo "::error::IMAGE_PREFIX must not include a tag. Use: ghcr.io/<owner>/<repo>"
            exit 1
          fi

          echo "IMAGE_PREFIX=${RAW_IMAGE_PREFIX}" >> $GITHUB_ENV

      - name: 🧾 Create deploy .env
        env:
          DEPLOY_DOTENV: ${{ secrets.DEPLOY_DOTENV }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          image_prefix = os.environ["IMAGE_PREFIX"].strip()
          raw_deploy_dotenv = os.environ.get("DEPLOY_DOTENV", "")

          lines: list[str] = [f"IMAGE_PREFIX={image_prefix}"]
          seen_keys = {"IMAGE_PREFIX"}

          for raw_line in raw_deploy_dotenv.splitlines():
            line = raw_line.strip()
            if not line or line.startswith("#") or "=" not in line:
              continue

            key = line.split("=", 1)[0].strip()
            if not key or key in seen_keys:
              continue

            lines.append(line)
            seen_keys.add(key)

          Path(".env").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Created deploy .env with keys:", ", ".join(line.split("=", 1)[0] for line in lines))
          PY

      - name: 🛟 Backup Current Server State
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            BACKUP_ROOT="$HOME/remote-access-backups"
            BACKUP_TS="$(date +%Y%m%d-%H%M%S)"
            BACKUP_DIR="$BACKUP_ROOT/$BACKUP_TS"

            mkdir -p "$BACKUP_DIR"

            if [ -d "$HOME/remote-access-service" ]; then
              cd "$HOME/remote-access-service"

              cp -v docker-compose.yml "$BACKUP_DIR/docker-compose.yml" >/dev/null 2>&1 || true
              cp -v .env "$BACKUP_DIR/.env" >/dev/null 2>&1 || true
              cp -v .env.production "$BACKUP_DIR/.env.production" >/dev/null 2>&1 || true
              cp -v frontend/.env.production "$BACKUP_DIR/frontend.env.production" >/dev/null 2>&1 || true

              docker compose ps -a > "$BACKUP_DIR/compose-ps.txt" 2>/dev/null || true
              docker compose images > "$BACKUP_DIR/compose-images.txt" 2>/dev/null || true
              docker compose logs --tail=300 postgres redis backend telegram_bot > "$BACKUP_DIR/compose-logs.txt" 2>/dev/null || true

              if docker compose ps --status running --services 2>/dev/null | grep -qx "postgres"; then
                docker compose exec -T postgres sh -lc 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP_DIR/postgres.dump"
              else
                echo "postgres is not running; skipped pg_dump" > "$BACKUP_DIR/postgres-backup-status.txt"
              fi
            else
              echo "$HOME/remote-access-service does not exist yet; skipped backup" > "$BACKUP_DIR/backup-status.txt"
            fi

            echo "Created backup at $BACKUP_DIR"
          EOF

      - name: 🚀 Deploy to Server
        run: |
          echo "[deploy] Workflow version: production-env-staging-rsync-2026-04-07"

          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            mkdir -p "$HOME/remote-access-service/.deploy-staging"
            cd "$HOME/remote-access-service"
          EOF

          # Copy compose + generated config files into staging first
          rsync -az -e "ssh -p ${{ secrets.SSH_PORT }}" docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/remote-access-service/.deploy-staging/docker-compose.yml
          rsync -az -e "ssh -p ${{ secrets.SSH_PORT }}" .env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/remote-access-service/.deploy-staging/.env
          rsync -az -e "ssh -p ${{ secrets.SSH_PORT }}" .env.production ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/remote-access-service/.deploy-staging/.env.production
          rsync -az -e "ssh -p ${{ secrets.SSH_PORT }}" frontend.env.production ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/remote-access-service/.deploy-staging/frontend.env.production

          # Connect and Deploy
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            cd ~/remote-access-service
            DEPLOY_STARTED_AT="$(date -Iseconds)"

            install_staged_file() {
              staged_path="$1"
              target_path="$2"
              ts="$(date +%Y%m%d-%H%M%S)"

              test -f "$staged_path"
              mkdir -p "$(dirname "$target_path")"

              if [ -L "$target_path" ] || [ -e "$target_path" ]; then
                if [ -d "$target_path" ]; then
                  mv "$target_path" "${target_path}.dir-backup.$ts"
                else
                  mv "$target_path" "${target_path}.backup.$ts"
                fi
              fi

              mv -f "$staged_path" "$target_path"
              test -f "$target_path"
              ls -ld "$target_path"
            }

            install_staged_file ".deploy-staging/docker-compose.yml" "docker-compose.yml"
            install_staged_file ".deploy-staging/.env" ".env"
            install_staged_file ".deploy-staging/.env.production" ".env.production"
            install_staged_file ".deploy-staging/frontend.env.production" "frontend.env.production"

            wait_for_container_health() {
              container_name="$1"
              timeout_seconds="${2:-120}"
              elapsed=0
              while [ "$elapsed" -lt "$timeout_seconds" ]; do
                status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_name" 2>/dev/null || true)"
                if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
                  echo "$container_name status=$status"
                  return 0
                fi
                sleep 2
                elapsed=$((elapsed + 2))
              done
              echo "$container_name did not become healthy in ${timeout_seconds}s"
              docker inspect "$container_name" || true
              return 1
            }

            diagnostics() {
              echo "Deploy diagnostics (failure snapshot):"
              echo "Failed command: ${BASH_COMMAND:-unknown}"
              docker compose ps -a || true
              docker compose logs --since "$DEPLOY_STARTED_AT" --tail=200 postgres redis backend telegram_bot || true
              if [ -n "${ALEMBIC_CONTAINER_NAME:-}" ] && docker ps -a --format '{{.Names}}' | grep -qx "$ALEMBIC_CONTAINER_NAME"; then
                echo "Alembic one-off logs:"
                docker logs "$ALEMBIC_CONTAINER_NAME" || true
              fi
            }
            trap diagnostics ERR

            # Validate env file early to avoid restart loops in backend/bot
            test -f .env.production
            if [ -d .env.production ]; then
              echo ".env.production is a directory, expected a file."
              exit 1
            fi
            grep -Eq '^DB__NAME=' .env.production
            grep -Eq '^DB__USERNAME=' .env.production
            grep -Eq '^DB__PASSWORD=' .env.production
            grep -Eq '^DB__HOST=\"?postgres\"?$' .env.production
            echo ".env.production contains DB settings for docker-compose"

            mkdir -p frontend
            mv -f frontend.env.production frontend/.env.production

            # Export environment for Docker Compose
            test -f .env
            set -a
            . ./.env
            set +a
            export IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            CONTAINER_PREFIX="${CONTAINER_PREFIX:-remote-access}"
            ALEMBIC_CONTAINER_NAME="${CONTAINER_PREFIX}-alembic-once"

            # Login to GHCR (PAT preferred; fallback to github.token; otherwise rely on existing server login)
            GHCR_USER="${{ secrets.GHCR_USERNAME }}"
            if [ -z "$GHCR_USER" ]; then
              GHCR_USER="${{ github.repository_owner }}"
            fi
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            elif [ -n "${{ github.token }}" ]; then
              echo "${{ github.token }}" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || echo "github.token login failed, will use existing Docker credentials on server."
            else
              echo "No GHCR token provided; using existing Docker credentials on server."
            fi

            ROOT_USAGE="$(df --output=pcent / | tail -1 | tr -dc '0-9')"
            if [ "${ROOT_USAGE:-0}" -ge 95 ]; then
              echo "Low disk space on / (${ROOT_USAGE}%). Running pre-pull image prune."
              docker image prune -af || true
            fi

            echo "[deploy] Pull images"
            # Pull updated images (including tools profile)
            if ! docker compose --profile tools pull; then
              echo "Image pull failed. Running additional cleanup and retrying once."
              docker image prune -af || true
              docker builder prune -af || true
              docker compose --profile tools pull
            fi

            echo "[deploy] Start infra"
            # Recreate infra first to avoid stale containers/images
            docker compose up -d --force-recreate --remove-orphans postgres redis

            # Ensure infra is healthy before continuing
            docker compose ps
            wait_for_container_health "${CONTAINER_PREFIX}-postgres" 120
            wait_for_container_health "${CONTAINER_PREFIX}-redis" 120

            # Cleanup stale one-off migration containers from interrupted runs
            docker ps -aq --filter "name=${CONTAINER_PREFIX}-alembic-run-" | xargs -r docker rm -f >/dev/null 2>&1 || true

            echo "[deploy] Run migrations"
            # Run migrations before app startup
            docker rm -f "$ALEMBIC_CONTAINER_NAME" >/dev/null 2>&1 || true
            ALEMBIC_CID="$(docker compose --profile tools run -d --name "$ALEMBIC_CONTAINER_NAME" alembic sh -lc 'cd /app && alembic current && alembic upgrade head && alembic current')"
            if ! timeout -k 10s 300s docker wait "$ALEMBIC_CID" > /tmp/alembic-exit-code; then
              echo "Alembic timed out. Container logs:"
              docker logs "$ALEMBIC_CID" || true
              docker rm -f "$ALEMBIC_CID" >/dev/null 2>&1 || true
              exit 1
            fi
            ALEMBIC_EXIT_CODE="$(cat /tmp/alembic-exit-code)"
            docker logs "$ALEMBIC_CID" || true
            docker rm -f "$ALEMBIC_CID" >/dev/null 2>&1 || true
            if [ "$ALEMBIC_EXIT_CODE" != "0" ]; then
              echo "Alembic failed. Last postgres logs:"
              docker compose logs --tail=200 postgres || true
              echo "Postgres activity snapshot:"
              docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select pid, usename, state, wait_event_type, wait_event, left(query, 140) as query from pg_stat_activity where datname=current_database() order by pid;"' || true
              echo "Postgres lock snapshot:"
              docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select locktype, mode, granted, pid, relation::regclass from pg_locks where database = (select oid from pg_database where datname=current_database()) order by granted, pid;"' || true
              exit 1
            fi
            echo "[deploy] Migrations completed"

            echo "[deploy] Start backend and bot"
            # Recreate app services with latest pulled images
            docker compose up -d --force-recreate --remove-orphans backend telegram_bot

            RUNNING_SERVICES="$(docker compose ps --status running --services || true)"
            if ! echo "$RUNNING_SERVICES" | grep -qx "backend"; then
              echo "backend is not running after deploy."
              docker compose ps -a
              docker compose logs --tail=200 backend || true
              exit 1
            fi
            if ! echo "$RUNNING_SERVICES" | grep -qx "telegram_bot"; then
              echo "telegram_bot is not running after deploy."
              docker compose ps -a
              docker compose logs --tail=200 telegram_bot || true
              exit 1
            fi

            echo "[deploy] Build frontend dist"
            # Update Frontend Files
            sudo mkdir -p /var/www/remote-access-service
            docker compose --profile tools run --rm frontend

            echo "[deploy] Services snapshot"
            docker compose ps -a

            sudo systemctl restart nginx

            # Cleanup
            docker image prune -af
          EOF
