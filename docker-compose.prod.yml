services:
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/example/remote-access-service}/backend:latest
    container_name: ${CONTAINER_PREFIX:-remote-access}-backend
    restart: unless-stopped
    environment:
      REMOTE_ACCESS_CONFIG_PATH: /app/.env.production
      DB__HOST: postgres
      DB__NAME: ${POSTGRES_DB:-remote_access}
      DB__USERNAME: ${POSTGRES_USER:-remote_access}
      DB__PASSWORD: ${POSTGRES_PASSWORD:-remote_access}
      REDIS__URL: redis://redis:6379/0
    volumes:
      - type: bind
        source: ./.env.production
        target: /app/.env.production
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  alembic:
    image: ${IMAGE_PREFIX:-ghcr.io/example/remote-access-service}/alembic:latest
    container_name: ${CONTAINER_PREFIX:-remote-access}-alembic
    restart: "no"
    environment:
      REMOTE_ACCESS_CONFIG_PATH: /app/.env.production
      DB__HOST: postgres
      DB__NAME: ${POSTGRES_DB:-remote_access}
      DB__USERNAME: ${POSTGRES_USER:-remote_access}
      DB__PASSWORD: ${POSTGRES_PASSWORD:-remote_access}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./.env.production
        target: /app/.env.production
        read_only: true
        bind:
          create_host_path: false

  telegram_bot:
    image: ${IMAGE_PREFIX:-ghcr.io/example/remote-access-service}/telegram_bot:latest
    container_name: ${CONTAINER_PREFIX:-remote-access}-bot
    restart: unless-stopped
    environment:
      REMOTE_ACCESS_CONFIG_PATH: /app/.env.production
      DB__HOST: postgres
      DB__NAME: ${POSTGRES_DB:-remote_access}
      DB__USERNAME: ${POSTGRES_USER:-remote_access}
      DB__PASSWORD: ${POSTGRES_PASSWORD:-remote_access}
      REDIS__URL: redis://redis:6379/0
    volumes:
      - type: bind
        source: ./.env.production
        target: /app/.env.production
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/telegram-bot-ready && pgrep -f 'python -m telegram_bot.main' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/example/remote-access-service}/frontend:latest
    container_name: ${CONTAINER_PREFIX:-remote-access}-frontend-extractor
    restart: "no"
    profiles:
      - tools
    command: >
      sh -c "rm -rf /frontend-dist/assets /frontend-dist/fonts /frontend-dist/favicon.svg /frontend-dist/index.html && cp -r /usr/share/nginx/html/* /frontend-dist/"
    volumes:
      - ${FRONTEND_PUBLIC_DIR:-/var/www/remote-access-service}:/frontend-dist

  postgres:
    image: postgres:15
    container_name: ${CONTAINER_PREFIX:-remote-access}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remote_access}
      POSTGRES_USER: ${POSTGRES_USER:-remote_access}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remote_access}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-remote_access} -d $${POSTGRES_DB:-remote_access}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-remote-access}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
