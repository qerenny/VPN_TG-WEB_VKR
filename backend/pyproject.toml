[tool.poetry]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the project"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "backend", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.135.3"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
httpx = "^0.27.0"
pydantic = "^2.6"
sqlmodel = "^0.0.16"
python-dotenv = "^1.0"
# Local shared dependency
shared = { path = "../shared", develop = true }
telegram-bot = { path = "../telegram_bot", develop = true }
pyjwt = "^2.10.1"
asyncpg = "^0.30.0"
psycopg2 = "^2.9.10"
alembic = "^1.16.2"
pyyaml = "^6.0.2"
pytz = "^2025.2"
python-dateutil = "^2.9.0.post0"
greenlet = "^3.2.3"
pytelegrambotapi = "^4.27.0"
aiohttp = "^3.12.13"
loguru = "^0.7.2"
sentry-sdk = "^2.53.0"
haikunator = "^2.1.0"
starlette = ">=0.47.2,<1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
mypy = "^1.9"
black = "^26.3.1"
aiosqlite = "^0.22.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
