[tool.poetry]
name = "telegram-bot"
version = "0.1.0"
description = "Telegram bot for the project"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "telegram_bot", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.135.3"
pytelegrambotapi = "^4.15"
httpx = "^0.27"
pydantic = "^2.6"
sqlmodel = "^0.0.16"
python-dotenv = "^1.0"
# Local shared dependency
shared = {path = "../shared", develop = true}
haikunator = "^2.1.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
pyyaml = "^6.0.2"
pytz = "^2025.2"
python-dateutil = "^2.9.0.post0"
greenlet = "^3.2.3"
loguru = "^0.7.2"
sentry-sdk = "^2.53.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
mypy = "^1.9"
black = "^26.3.1"
pytest-asyncio = "^1.3.0"
pytest-cov = "^5.0"
aiosqlite = "^0.22.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
