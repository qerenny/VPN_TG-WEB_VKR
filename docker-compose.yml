services:
  postgres:
    image: postgres:15
    container_name: ${CONTAINER_PREFIX:-remote-access}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remote_access}
      POSTGRES_USER: ${POSTGRES_USER:-remote_access}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remote_access}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-remote_access} -d $${POSTGRES_DB:-remote_access}"]
      interval: 10s 
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-remote-access}-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ${CONTAINER_PREFIX:-remote-access}-backend
    restart: unless-stopped
    environment:
      REMOTE_ACCESS_CONFIG_PATH: /app/.env.local
      DB__HOST: postgres
      DB__NAME: ${POSTGRES_DB:-remote_access}
      DB__USERNAME: ${POSTGRES_USER:-remote_access}
      DB__PASSWORD: ${POSTGRES_PASSWORD:-remote_access}
      REDIS__URL: redis://redis:6379/0
    volumes:
      - ./shared:/app/shared
      - ./backend:/app/backend 
      - ./telegram_bot:/app/telegram_bot
      - ./.env.local:/app/.env.local

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy 
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully

  telegram_bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    container_name: ${CONTAINER_PREFIX:-remote-access}-bot
    restart: unless-stopped
    environment:
      REMOTE_ACCESS_CONFIG_PATH: /app/.env.local
      DB__HOST: postgres
      DB__NAME: ${POSTGRES_DB:-remote_access}
      DB__USERNAME: ${POSTGRES_USER:-remote_access}
      DB__PASSWORD: ${POSTGRES_PASSWORD:-remote_access}
      REDIS__URL: redis://redis:6379/0
    volumes:
      - ./shared:/app/shared
      - ./telegram_bot:/app/telegram_bot # Проброс для разработки
      - ./.env.local:/app/.env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/telegram-bot-ready && pgrep -f 'python -m telegram_bot.main' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  alembic:
    build:
      context: .
      dockerfile: shared/alembic/Dockerfile
    container_name: ${CONTAINER_PREFIX:-remote-access}-alembic
    restart: "no"
    environment:
      REMOTE_ACCESS_CONFIG_PATH: /app/.env.local
      DB__HOST: postgres
      DB__NAME: ${POSTGRES_DB:-remote_access}
      DB__USERNAME: ${POSTGRES_USER:-remote_access}
      DB__PASSWORD: ${POSTGRES_PASSWORD:-remote_access}
    volumes:
      - ./shared:/app/shared
      - ./shared/alembic:/app/alembic
      - ./shared/alembic.ini:/app/alembic.ini
      - ./.env.local:/app/.env.local
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ${CONTAINER_PREFIX:-remote-access}-frontend-builder
    profiles: ["tools"] # Не запускается сам по себе
    command: >
      sh -c "rm -rf /frontend-dist/assets /frontend-dist/fonts /frontend-dist/favicon.svg /frontend-dist/index.html && cp -r /usr/share/nginx/html/* /frontend-dist/"
    volumes:
      - ./frontend/dist:/frontend-dist

volumes:
  pgdata:
