[defaults]

inventory=./inventory/
log_path=./logs/ansible.log
roles_path=./roles
private_key_file=~/.ssh/remote_access_servers

remote_user=remote-access-user
remote_port=18181
host_key_checking=True
become=True
become_method=sudo

gathering=smart
editor=nano

[vault]
vault_password_file = ./.vault_pass
